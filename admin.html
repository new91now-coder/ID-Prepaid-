<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ID Prepaid</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #2d3748; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #edf2f7; }
        th { background: #2b6cb0; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background: #feebc8; color: #9c4221; }
        .back-btn { display: inline-block; margin-bottom: 15px; background: #4a5568; color: white; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; }
        .back-btn:hover { background: #2d3748; }
    </style>
</head>
<body>

    <!-- Security Check Script (LocalStorage for Permanent Login) -->
    <script>
        const ADMIN_PASSWORD = "Myadmin-@1515"; // यहाँ अपना पासवर्ड बदल सकते हैं

        function checkAdminAuth() {
            let savedAuth = localStorage.getItem("admin_authenticated");
            
            if (savedAuth !== "true") {
                let enteredPassword = prompt("🔐 सुरक्षा चेतावनी: कृपया एडमिन पैनल का पासवर्ड दर्ज करें:");
                
                if (enteredPassword === ADMIN_PASSWORD) {
                    localStorage.setItem("admin_authenticated", "true");
                    alert("✅ लॉगिन सफल!");
                } else {
                    alert("❌ गलत पासवर्ड! आपको होमपेज पर रीडायरेक्ट किया जा रहा है।");
                    window.location.href = "index.html";
                }
            }
        }
        checkAdminAuth();
    </script>

    <div class="admin-container">
        <a href="index.html" class="back-btn">← Back to Home</a>
        <h2>Admin Panel - Live Recharge Requests</h2>
        
        <table>
            <thead>
                <tr>
                    <th>Prepaid ID</th>
                    <th>Mobile / ID</th>
                    <th>Operator</th>
                    <th>Amount</th>
                    <th>UTR / Txn ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="adminTableBody">
                <tr><td colspan="6" style="text-align:center; color:#a0aec0;">Loading data from Firebase...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- Firebase SDK & Firestore Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCDXuzDPOqwwPY_izDcaadOzU7t_Roujbs",
            authDomain: "id-detabase.firebaseapp.com",
            projectId: "id-detabase",
            storageBucket: "id-detabase.firebasestorage.app",
            messagingSenderId: "578329434425",
            appId: "1:578329434425:web:dea423f1799d93e91470e8",
            measurementId: "G-MBWG5ZH2M4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fetch Data from Firebase Firestore Database
        window.onload = async function() {
            const tbody = document.getElementById('adminTableBody');
            try {
                const querySnapshot = await getDocs(collection(db, "recharges")); // सुनिश्चित करें कि आपके डेटाबेस कलेक्शन का नाम 'recharges' है
                let historyData = [];
                
                querySnapshot.forEach((doc) => {
                    historyData.push(doc.data());
                });

                // अगर Firebase में डेटा न मिले तो फॉलबैक के लिए LocalStorage चेक करेगा
                if(historyData.length === 0) {
                    historyData = JSON.parse(localStorage.getItem('recharge_history')) || [];
                }

                if(historyData.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#a0aec0;">No recharge requests found.</td></tr>`;
                    return;
                }

                tbody.innerHTML = historyData.map(item => `
                    <tr>
                        <td><b>${item.prepaidId || '-'}</b></td>
                        <td>${item.phone || item.mobile || '-'}</td>
                        <td style="text-transform:uppercase;">${item.operator || '-'}</td>
                        <td>₹${item.amount || item.plan || '0'}</td>
                        <td>${item.utr || '-'}</td>
                        <td><span class="status-badge">${item.status || 'Pending Verification'}</span></td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error("Error fetching from Firebase: ", error);
                // एरर आने पर लोकल स्टोरेज का डेटा दिखाएगा ताकि साइट रुके नहीं
                const fallbackData = JSON.parse(localStorage.getItem('recharge_history')) || [];
                if(fallbackData.length > 0) {
                    tbody.innerHTML = fallbackData.map(item => `
                        <tr>
                            <td><b>${item.prepaidId}</b></td>
                            <td>${item.phone}</td>
                            <td style="text-transform:uppercase;">${item.operator}</td>
                            <td>₹${item.amount}</td>
                            <td>${item.utr}</td>
                            <td><span class="status-badge">${item.status}</span></td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Error loading database connection.</td></tr>`;
                }
            }
        };
    </script>
</body>
</html>
