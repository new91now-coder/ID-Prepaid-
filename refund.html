<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Refund - ID Prepaid</title>
    <link rel="stylesheet" href="style.css">
    <!-- EmailJS SDK CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("rrZ8kPmzFlgDWK813");
        })();
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-text">ID Prepaid</span>
        </div>
    </header>

    <div class="container" style="max-width: 450px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="font-size: 18px; color: #2d3748; margin-bottom: 10px;">Help & Refund Center</h2>
        <p style="font-size: 12px; color: #718096; line-height: 1.5; margin-bottom: 15px;">
            Facing any issue with your recharge? Submit your details below, and our support team will get back to your email.
        </p>

        <!-- Form with correct names matching EmailJS template -->
        <form id="support-form">
            
            <div class="form-group" style="margin-bottom: 12px;">
                <label style="font-size: 11px; font-weight: bold; color: #4a5568;">Select Request Type</label>
                <select name="request_type" class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e0; border-radius:8px; margin-top:4px; background: #fff;">
                    <option value="Refund Request">Refund Request (पैसे वापसी)</option>
                    <option value="Recharge Pending Help">Recharge Pending / Failed (पेंडिंग रिचार्ज)</option>
                    <option value="General Support">General Help / Other (सामान्य सहायता)</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 12px;">
                <label style="font-size: 11px; font-weight: bold; color: #4a5568;">Transaction ID / UTR Number</label>
                <input type="text" name="transaction_id" placeholder="e.g. IDP984210 or UTR" required class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e0; border-radius:8px; margin-top:4px;">
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 11px; font-weight: bold; color: #4a5568;">Your Email Address</label>
                <input type="email" name="user_email" placeholder="Enter your email for reply" required class="form-control" style="width:100%; padding:10px; border:1px solid #cbd5e0; border-radius:8px; margin-top:4px;">
            </div>

            <button type="submit" id="submit-btn" style="width:100%; background: #3182ce; padding: 12px; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Submit Request</button>
        </form>
    </div>

    <!-- EmailJS Script -->
    <script>
        const form = document.getElementById('support-form');
        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Submitting...";
            submitBtn.disabled = true;

            const serviceID = "service_rson7tk"; 
            const templateID = "template_rwpb6ps"; // आपकी दी हुई नई Template ID

            emailjs.sendForm(serviceID, templateID, this)
                .then(() => {
                    submitBtn.innerText = "Submitted Successfully!";
                    submitBtn.style.background = "#38a169";
                    alert('Your request has been submitted successfully! We will get back to you soon.');
                    form.reset();
                    submitBtn.innerText = "Submit Request";
                    submitBtn.disabled = false;
                    submitBtn.style.background = "#3182ce";
                }, (err) => {
                    submitBtn.innerText = "Submit Request";
                    submitBtn.disabled = false;
                    alert('Submission failed... Please check console/network.');
                    console.log('FAILED...', err);
                });
        });
    </script>
</body>
</html>
