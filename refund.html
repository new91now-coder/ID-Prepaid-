<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Refund - ID Prepaid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background: #ffffff; width: 100%; max-width: 400px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .brand { color: #0ea5e9; font-size: 22px; font-weight: bold; margin-bottom: 20px; }
        .title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.4; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 12px; font-weight: bold; color: #334155; margin-bottom: 6px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; background: #f8fafc; color: #1e293b; }
        select:focus, input:focus { border-color: #0ea5e9; background: #fff; }
        .btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="card">
    <div class="brand">ID Prepaid</div>
    <div class="title">Help & Refund Center</div>
    <div class="subtitle">Facing any issue with your recharge? Submit your details below, and it will open your email to send directly.</div>

    <form id="support-form" onsubmit="sendEmail(event)">
        
        <!-- Select Request Type -->
        <div class="form-group">
            <label>Select Request Type</label>
            <select id="request_type" onchange="toggleUtrField()">
                <option value="Refund Request (पैसे वापसी)">Refund Request (पैसे वापसी)</option>
                <option value="Recharge Pending / Failed (पेंडिंग रिचार्ज)">Recharge Pending / Failed (पेंडिंग रिचार्ज)</option>
                <option value="General Help / Other (सामान्य सहायता)">General Help / Other (सामान्य सहायता)</option>
            </select>
        </div>

        <!-- Transaction ID / UTR Number (Dynamic) -->
        <div class="form-group" id="utr-group">
            <label>Transaction ID / UTR Number</label>
            <input type="text" id="transaction_id" placeholder="e.g. IDP984210 or UTR">
        </div>

        <!-- Your Email Address -->
        <div class="form-group">
            <label>Your Email Address (For Reply)</label>
            <input type="email" id="user_email" placeholder="Enter your email for reply" required>
        </div>

        <button type="submit" class="btn">Submit Request</button>
    </form>
</div>

<script>
    // लॉजिक: अगर यूजर General Help चुनेगा, तो UTR की जरूरत नहीं है, फील्ड छुप जाएगी।
    function toggleUtrField() {
        const reqType = document.getElementById('request_type').value;
        const utrGroup = document.getElementById('utr-group');
        const utrInput = document.getElementById('transaction_id');

        if (reqType.includes('General Help')) {
            utrGroup.style.display = 'none';
            utrInput.value = 'N/A';
        } else {
            utrGroup.style.display = 'block';
            utrInput.value = '';
        }
    }

    // मेलटो रीडायरेक्ट फंक्शन (सीधे जीमेल/मेल ऐप खुलेगा)
    function sendEmail(event) {
        event.preventDefault();

        const reqType = document.getElementById('request_type').value;
        const utr = document.getElementById('transaction_id').value || 'N/A';
        const userEmail = document.getElementById('user_email').value;

        const recipientEmail = "idprepaid.support@gmail.com";
        const subject = encodeURIComponent("Support Request: " + reqType);
        
        const bodyText = encodeURIComponent(
            "Hello Support Team,\n\n" +
            "I need help regarding my account/recharge.\n\n" +
            "Request Type: " + reqType + "\n" +
            "Transaction ID / UTR: " + utr + "\n" +
            "My Contact Email: " + userEmail + "\n\n" +
            "Please resolve this issue as soon as possible."
        );

        // मेलटो लिंक बनाना ताकि यूजर का मेल ऐप डायरेक्ट खुल जाए
        const mailtoLink = `mailto:${recipientEmail}?subject=${subject}&body=${bodyText}`;
        
        window.location.href = mailtoLink;
    }
</script>

</body>
</html>
