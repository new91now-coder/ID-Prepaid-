<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & UTR Verification - ID Prepaid</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .payment-container { width: 100%; max-width: 450px; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #2d3748; margin-bottom: 15px; text-align: center; font-size: 20px; }
        .info-box { background: #edf2f7; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #4a5568; }
        .info-box p { margin: 5px 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #4a5568; font-size: 13px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        .submit-btn { width: 100%; background: #3182ce; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn:hover { background: #2b6cb0; }
    </style>
</head>
<body>

    <div class="payment-container">
        <h2>Complete Your Payment</h2>
        
        <div class="info-box" id="summaryBox">
            <p><b>Prepaid ID:</b> <span id="dispId">-</span></p>
            <p><b>Mobile / ID:</b> <span id="dispPhone">-</span></p>
            <p><b>Operator:</b> <span id="dispOperator">-</span></p>
            <p><b>Amount:</b> ₹<span id="dispAmount">-</span></p>
        </div>

        <div class="form-group">
            <label>Enter 12-Digit UTR / Transaction ID:</label>
            <input type="text" id="utrInput" placeholder="e.g. 435678123456" maxlength="12">
        </div>

        <button class="submit-btn" onclick="submitUtrAndVerify()">Submit UTR & Verify</button>
    </div>

    <!-- Firebase SDK & UTR Submission Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDXuzDPOqwwPY_izDcaadOzU7t_Roujbs",
            authDomain: "id-detabase.firebaseapp.com",
            projectId: "id-detabase",
            storageBucket: "id-detabase.firebasestorage.app",
            messagingSenderId: "578329434425",
            appId: "1:578329434425:web:dea423f1799d93e91470e8",
            measurementId: "G-MBWG5ZH2M4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL Parameters se data uthana
        const urlParams = new URLSearchParams(window.location.search);
        const prepaidId = urlParams.get('prepaidId') || 'ID' + Math.floor(100000 + Math.random() * 900000);
        const phone = urlParams.get('phone') || '9876543210';
        const operator = urlParams.get('operator') || 'jio';
        const amount = urlParams.get('amount') || '199';
        const finalPayable = urlParams.get('payable') || amount;
        const discount = urlParams.get('discount') || '0';
        const n8nWebhookUrl = "YOUR_N8N_WEBHOOK_URL_HERE"; // Agar n8n use kar rahe ho toh yahan link dal dena

        // Display details on page
        document.getElementById('dispId').innerText = prepaidId;
        document.getElementById('dispPhone').innerText = phone;
        document.getElementById('dispOperator').innerText = operator.toUpperCase();
        document.getElementById('dispAmount').innerText = finalPayable;

        // Global function for submit button
        window.submitUtrAndVerify = async function() {
            let utr = document.getElementById('utrInput').value.trim();

            if(utr.length < 10) {
                alert("Kripya sahi 12-digit UTR / Transaction ID darj karein!");
                return;
            }

            let rechargePayload = {
                prepaidId: prepaidId,
                phone: phone,
                operator: operator,
                amount: parseFloat(amount),
                finalPayable: finalPayable,
                utr: utr,
                timestamp: new Date().toLocaleString(),
                status: "Pending Verification"
            };

            // 1. Save to LocalStorage as backup
            let existingHistory = JSON.parse(localStorage.getItem('recharge_history')) || [];
            existingHistory.unshift(rechargePayload);
            localStorage.setItem('recharge_history', JSON.stringify(existingHistory));

            // 2. Save directly to Firebase Firestore Database
            try {
                await addDoc(collection(db, "recharges"), rechargePayload);
                console.log("Data successfully saved to Firebase!");
            } catch (e) {
                console.error("Error adding document to Firebase: ", e);
                alert("Database connection error! Lekin aapka data save karne ki koshish ki gayi hai.");
            }

            // 3. Optional n8n webhook sync
            let sheetPayload = {
                prepaidId: prepaidId,
                mobile: phone,
                operator: operator,
                plan: amount,
                discount: discount,
                amount: finalPayable,
                utr: utr
            };

            fetch(n8nWebhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                keepalive: true,
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(sheetPayload)
            }).catch(err => console.log('Background sync error'));

            alert("UTR successfully submit ho gaya hai! Prepaid ID: " + prepaidId);
            window.location.href = 'history.html';
        }
    </script>
</body>
</html>
