<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - ID Prepaid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-text">ID Prepaid</span>
        </div>
    </header>

    <div class="container" style="max-width: 420px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h2 style="font-size: 18px; color: #2d3748; margin-bottom: 12px; text-align: center;">Complete Payment</h2>
        
        <!-- रिचार्ज समरी बॉक्स -->
        <div style="background: #f7fafc; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 13px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: #718096;">Target Number:</span>
                <span id="payPhone" style="font-weight: bold; color: #2d3748;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: #718096;">Operator:</span>
                <span id="payOperator" style="font-weight: bold; color: #2d3748; text-transform: uppercase;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                <span style="color: #718096;">Final Payable:</span>
                <span id="payFinal" style="font-weight: bold; color: #2b6cb0; font-size: 15px;">-</span>
            </div>
        </div>

        <!-- डायरेक्ट ऐप खोलने के लिए Intent Buttons -->
        <div style="margin-bottom: 15px;">
            <p style="font-size: 12px; color: #4a5568; margin-bottom: 8px; font-weight: bold; text-align: center;">1. Click to Pay via UPI App:</p>
            <div style="display: flex; gap: 8px; justify-content: center;">
                <a id="gpayBtn" href="#" style="flex: 1; padding: 10px; background: #1a73e8; color: white; text-align: center; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: bold;">Google Pay</a>
                <a id="phonepeBtn" href="#" style="flex: 1; padding: 10px; background: #5f259f; color: white; text-align: center; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: bold;">PhonePe</a>
                <a id="paytmBtn" href="#" style="flex: 1; padding: 10px; background: #00b9f1; color: white; text-align: center; border-radius: 8px; font-size: 13px; text-decoration: none; font-weight: bold;">Paytm</a>
            </div>
        </div>

        <div style="text-align: center; margin: 10px 0; color: #a0aec0; font-size: 12px;">OR SCAN QR</div>

        <!-- क्यूआर कोड बॉक्स -->
        <div style="text-align: center; margin-bottom: 15px; background: #fff; padding: 10px; border: 1px solid #e2e8f0; border-radius: 12px;">
            <img id="dynamicQrImg" src="" alt="UPI QR Code" style="width: 160px; height: 160px; border-radius: 6px;">
            <p id="upiIdDisplay" style="font-size: 11px; color: #718096; margin-top: 5px;"></p>
        </div>

        <!-- UTR इनपुट बॉक्स और सबमिट बटन -->
        <div style="background: #fffaf0; border: 1px solid #feebc8; padding: 12px; border-radius: 10px; margin-bottom: 15px;">
            <label for="utrInput" style="display: block; font-size: 12px; font-weight: bold; color: #9c4221; margin-bottom: 5px;">Enter 12-Digit UTR / Transaction ID after payment:</label>
            <input type="text" id="utrInput" placeholder="e.g. 4235XXXXXXXX" maxlength="12" style="width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; margin-bottom: 8px;">
            <button onclick="submitUtrAndVerify()" style="width: 100%; padding: 12px; background: #38a169; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">Verify & Complete Recharge</button>
        </div>
    </div>

    <script>
        const merchantUpiId = "9166180665@kotakbank"; 
        const merchantName = "ID Prepaid";

        const urlParams = new URLSearchParams(window.location.search);
        const phone = urlParams.get('phone') || '9876543210';
        const amount = parseFloat(urlParams.get('amount')) || 349;
        const operator = urlParams.get('operator') || 'Jio';

        let discount = (amount * 0.009).toFixed(2);
        let finalPayable = (amount - discount).toFixed(2);

        document.getElementById('payPhone').innerText = phone;
        document.getElementById('payOperator').innerText = operator;
        document.getElementById('payFinal').innerText = '₹' + finalPayable;
        document.getElementById('upiIdDisplay').innerText = 'UPI ID: ' + merchantUpiId;

        // UPI Intent URI
        let upiString = `upi://pay?pa=${encodeURIComponent(merchantUpiId)}&pn=${encodeURIComponent(merchantName)}&am=${finalPayable}&cu=INR&tn=Recharge_${phone}`;

        // यहाँ गड़बड़ी थी जिसे ठीक कर दिया गया है:
        document.getElementById('gpayBtn').setAttribute('href', upiString);
        document.getElementById('phonepeBtn').setAttribute('href', upiString);
        document.getElementById('paytmBtn').setAttribute('href', upiString);

        // क्यूआर कोड लिंक सेट करना
        let qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upiString)}`;
        document.getElementById('dynamicQrImg').src = qrApiUrl;

        function submitUtrAndVerify() {
            let utr = document.getElementById('utrInput').value.trim();

            if(utr.length < 10) {
                alert("Please enter a valid 12-digit UTR / Transaction ID!");
                return;
            }

            localStorage.setItem('last_recharge_phone', phone);
            localStorage.setItem('last_recharge_amount', amount);
            localStorage.setItem('last_recharge_final', finalPayable);
            localStorage.setItem('last_recharge_operator', operator);
            localStorage.setItem('last_recharge_txid', utr);

            window.location.href = 'status.html';
        }
    </script>
</body>
</html>
