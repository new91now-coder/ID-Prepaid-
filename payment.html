<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - ID Prepaid</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
        header { background: #1a202c; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo-text { font-size: 18px; font-weight: bold; letter-spacing: 0.5px; }
        .nav-buttons { display: flex; gap: 10px; }
        .nav-btn { background: #2b6cb0; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; text-decoration: none; }
        .nav-btn:hover { background: #2c5282; }
        .container { max-width: 420px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { font-size: 18px; color: #2d3748; margin-bottom: 12px; text-align: center; }
        .summary-box { background: #f7fafc; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 13px; border: 1px solid #edf2f7; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
        .summary-label { color: #718096; }
        .summary-value { font-weight: bold; color: #2d3748; }
        .qr-section { text-align: center; margin-bottom: 15px; background: #fff; padding: 12px; border: 1px solid #e2e8f0; border-radius: 12px; }
        .qr-img { width: 160px; height: 160px; border-radius: 6px; }
        .upi-text { font-size: 11px; color: #718096; margin-top: 6px; font-weight: 500; }
        .utr-box { background: #fffaf0; border: 1px solid #feebc8; padding: 12px; border-radius: 10px; margin-bottom: 15px; }
        .utr-label { display: block; font-size: 12px; font-weight: bold; color: #9c4221; margin-bottom: 5px; }
        .utr-input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; margin-bottom: 8px; outline: none; }
        .utr-input:focus { border-color: #38a169; }
        .verify-btn { width: 100%; padding: 12px; background: #38a169; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
        .verify-btn:hover { background: #2f855a; }
    </style>

    <!-- Firebase SDK Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCDXuzDPOqwwPY_izDcaadOzU7t_Roujbs",
            authDomain: "id-detabase.firebaseapp.com",
            projectId: "id-detabase",
            storageBucket: "id-detabase.firebasestorage.app",
            messagingSenderId: "578329434425",
            appId: "1:578329434425:web:dea423f1799d93e91470e8",
            measurementId: "G-MBWG5ZH2M4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
        window.addDoc = addDoc;
        window.collection = collection;
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <span class="logo-text">ID Prepaid</span>
        </div>
        <div class="nav-buttons">
            <a href="history.html" class="nav-btn">History</a>
            <a href="index.html" class="nav-btn" style="background: #4a5568;">Home</a>
        </div>
    </header>

    <div class="container">
        <h2>Complete Payment</h2>
        
        <div class="summary-box">
            <div class="summary-row">
                <span class="summary-label">Prepaid ID:</span>
                <span id="payPrepaidId" class="summary-value">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Target Number:</span>
                <span id="payPhone" class="summary-value">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Operator:</span>
                <span id="payOperator" class="summary-value" style="text-transform: uppercase;">-</span>
            </div>
            <div class="summary-row">
                <span class="summary-label">Final Payable:</span>
                <span id="payFinal" class="summary-value" style="color: #2b6cb0; font-size: 15px;">-</span>
            </div>
        </div>

        <div style="text-align: center; margin: 8px 0; color: #a0aec0; font-size: 11px; font-weight: bold;">SCAN QR & PAY VIA ANY UPI APP</div>

        <div class="qr-section">
            <img id="dynamicQrImg" src="" alt="UPI QR Code" class="qr-img">
            <p id="upiIdDisplay" class="upi-text"></p>
        </div>

        <div class="utr-box">
            <label for="utrInput" class="utr-label">Enter 12-Digit UTR / Transaction ID:</label>
            <input type="text" id="utrInput" placeholder="e.g. 4235XXXXXXXX" maxlength="12" class="utr-input">
            <button onclick="submitUtrAndVerify()" class="verify-btn">Verify & Submit Request</button>
        </div>
    </div>

    <script>
        const merchantUpiId = "9166180665@kotakbank"; 
        const merchantName = "ID Prepaid";
        const n8nWebhookUrl = "https://script.google.com/macros/s/AKfycbw9EMEtg_TW2-0GHdqkpKsF9AolPXC8FM4bpuGmPq8SJL7sdAD-YYz2NlEyuWX0g9GCXw/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const phone = urlParams.get('phone') || '9876543210';
        const amount = parseFloat(urlParams.get('amount')) || 349;
        const operator = (urlParams.get('operator') || 'jio').toLowerCase();

        // Operator Wise Discount Logic matching backend configuration
        let rate = 0.01;
        if (operator === 'jio') {
            rate = 0.005; // 0.5%
        } else if (operator === 'airtel' || operator === 'airtelndth') {
            rate = 0.006; // 0.6%
        }

        let discount = (amount * rate).toFixed(2);
        let finalPayable = (amount - discount).toFixed(2);

        function generatePrepaidId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let s = '';
            for (let i = 0; i < 6; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
            return 'IDP' + s;
        }
        const prepaidId = generatePrepaidId();
        document.getElementById('payPrepaidId').innerText = prepaidId;

        document.getElementById('payPhone').innerText = phone;
        document.getElementById('payOperator').innerText = operator;
        document.getElementById('payFinal').innerText = '₹' + finalPayable;
        document.getElementById('upiIdDisplay').innerText = 'UPI ID: ' + merchantUpiId;

        let upiString = `upi://pay?pa=${encodeURIComponent(merchantUpiId)}&pn=${encodeURIComponent(merchantName)}&am=${finalPayable}&cu=INR&tn=Recharge_${phone}`;
        let qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(upiString)}`;
        document.getElementById('dynamicQrImg').src = qrApiUrl;

        async function submitUtrAndVerify() {
            let utr = document.getElementById('utrInput').value.trim();

            if(utr.length < 10) {
                alert("Please enter a valid 12-digit UTR / Transaction ID!");
                return;
            }

            let rechargePayload = {
                prepaidId: prepaidId,
                phone: phone,
                operator: operator,
                amount: amount,
                finalPayable: finalPayable,
                utr: utr,
                timestamp: new Date().toLocaleString(),
                status: "Pending Verification"
            };

            let existingHistory = JSON.parse(localStorage.getItem('recharge_history')) || [];
            existingHistory.unshift(rechargePayload);
            localStorage.setItem('recharge_history', JSON.stringify(existingHistory));

            // Save to Firebase Firestore
            try {
                if (window.db && window.addDoc && window.collection) {
                    await window.addDoc(window.collection(window.db, "recharges"), rechargePayload);
                }
            } catch (e) {
                console.error("Firebase error: ", e);
            }

            let sheetPayload = {
                prepaidId: prepaidId,
                mobile: phone,
                operator: operator,
                plan: amount,
                discount: discount,
                amount: finalPayable,
                utr: utr
            };

            fetch(n8nWebhookUrl, {
                method: 'POST',
                mode: 'no-cors',
                keepalive: true,
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(sheetPayload)
            }).catch(err => console.log('Background sync error'));

            alert("UTR submitted successfully! Your Prepaid ID: " + prepaidId + "\nYour recharge request is under verification.");
            window.location.href = 'history.html';
        }
    </script>
</body>
</html>
