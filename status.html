<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Receipt - ID Prepaid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <span class="logo-text">ID Prepaid</span>
        </div>
    </header>

    <div class="container" style="max-width: 450px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <div style="text-align: center; margin-bottom: 20px;">
            <div style="font-size: 40px; color: #38a169;">✔</div>
            <h2 style="color: #2f855a; font-size: 20px; margin-top: 5px;">Recharge Successful</h2>
            <p style="font-size: 12px; color: #718096;">Your automated top-up was processed instantly.</p>
        </div>

        <div style="background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; font-size: 13px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e0; padding-bottom: 8px;">
                <span style="color: #718096;">Transaction ID / UTR:</span>
                <span id="resTxId" style="font-weight: bold; color: #2d3748;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e0; padding-bottom: 8px;">
                <span style="color: #718096;">Mobile / Number:</span>
                <span id="resPhone" style="font-weight: bold; color: #2d3748;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e0; padding-bottom: 8px;">
                <span style="color: #718096;">Operator & Plan:</span>
                <span id="resPlan" style="font-weight: bold; color: #2d3748; text-transform: uppercase;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px dashed #cbd5e0; padding-bottom: 8px;">
                <span style="color: #718096;">Discount Earned:</span>
                <span id="resDiscount" style="font-weight: bold; color: #38a169;">-</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #1a202c;">
                <span>Total Paid:</span>
                <span id="resAmount">-</span>
            </div>
        </div>

        <button onclick="window.location.href='index.html'" class="btn-pay" style="margin-top: 20px; width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Make Another Recharge</button>
    </div>

    <script>
        // LocalStorage से हर यूजर का अलग और लाइव डेटा लोड करना
        document.getElementById('resPhone').innerText = localStorage.getItem('last_recharge_phone') || '9876543210';
        document.getElementById('resTxId').innerText = localStorage.getItem('last_recharge_txid') || 'IDP8942019';
        
        let op = localStorage.getItem('last_recharge_operator') || 'Jio';
        let amt = localStorage.getItem('last_recharge_amount') || '349';
        document.getElementById('resPlan').innerText = `${op} - ₹${amt}`;

        let disc = localStorage.getItem('last_recharge_discount') || '3.15';
        let final = localStorage.getItem('last_recharge_final') || '345.85';

        document.getElementById('resDiscount').innerText = `₹${disc} (1% OFF)`;
        document.getElementById('resAmount').innerText = `₹${final}`;
    </script>
</body>
</html>
